<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #f4ead9;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="48"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-quote"
        class="scene"
        data-composition-id="02-quote"
        data-composition-src="compositions/frames/02-quote.html"
        data-start="6"
        data-duration="7.4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-premise"
        class="scene"
        data-composition-id="03-premise"
        data-composition-src="compositions/frames/03-premise.html"
        data-start="13"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-four-marks"
        class="scene"
        data-composition-id="04-four-marks"
        data-composition-src="compositions/frames/04-four-marks.html"
        data-start="21"
        data-duration="10.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-testimonial"
        class="scene"
        data-composition-id="05-testimonial"
        data-composition-src="compositions/frames/05-testimonial.html"
        data-start="31"
        data-duration="7.4"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="38"
        data-duration="10"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-02-quote", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.to("#el-02-quote", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 13);
        tl.fromTo("#el-03-premise", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 13);
        tl.to("#el-03-premise", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 21);
        tl.fromTo("#el-04-four-marks", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 21);
        tl.to("#el-04-four-marks", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.fromTo("#el-05-testimonial", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.to("#el-05-testimonial", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 38);
        tl.fromTo("#el-06-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 38);
        tl.to({}, { duration: 48 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
