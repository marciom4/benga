<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata only for the source file; the HyperFrames runtime
         discards everything outside <template> — see hyperframes-core. -->
  </head>
  <body>
    <template>
      <style>
        /* Root styled by #root only — never a class on the data-composition-id
           element (subcomposition_root_styled_by_class). Descendants use
           plain selectors. */
        #root {
          position: relative;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          background: transparent; /* ground painted by #hook-bg clip, not root */
        }

        /* ── Full-bleed ink ground (its own clip, not on #root) ─────────── */
        #hook-bg {
          position: absolute;
          inset: 0;
          background: #0b0806;
        }

        /* ── Ambient amber glow, top-center, behind everything else ─────── */
        #hook-glow {
          position: absolute;
          left: 50%;
          top: -140px;
          width: 920px;
          height: 640px;
          margin-left: -460px; /* centers without touching `transform` — GSAP owns
                                   that property below (scale) and would silently
                                   drop a CSS translate(-50%) centering otherwise */
          transform-origin: 50% 30%;
          background: radial-gradient(
            ellipse 55% 45% at 50% 35%,
            rgba(226, 130, 63, 0.92) 0%,
            rgba(226, 130, 63, 0.4) 35%,
            rgba(11, 8, 6, 0) 72%
          );
          opacity: 0;
          pointer-events: none;
          will-change: transform, opacity;
        }

        /* ── Stacked kinetic-type column, fixed center anchor ───────────── */
        .hook-stack {
          position: absolute;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "Inter", sans-serif;
          color: #f4ead9;
        }

        #hook-eyebrow {
          top: 228px;
          font-family: "Inter", sans-serif;
          font-weight: 700;
          font-size: 15px;
          line-height: 1.3;
          letter-spacing: 4px;
          text-transform: uppercase;
          color: #e2823f;
          opacity: 0;
          will-change: transform, opacity;
        }

        #hook-a {
          top: 274px;
          font-family: "Bebas Neue", sans-serif;
          font-weight: 400;
          font-size: 56px;
          line-height: 1;
          letter-spacing: 2px;
          text-transform: uppercase;
          color: #f4ead9;
          transform-origin: 50% 50%;
          opacity: 0;
          will-change: transform, opacity;
        }

        #hook-hero {
          top: 340px;
          font-family: "Bebas Neue", sans-serif;
          font-weight: 400;
          font-size: 190px;
          line-height: 0.9;
          letter-spacing: 4px;
          text-transform: uppercase;
          color: #f4ead9;
          white-space: nowrap;
          opacity: 0;
          filter: blur(0px);
          will-change: transform, opacity, filter;
        }

        #hook-subline {
          top: 531px;
          font-family: "Bebas Neue", sans-serif;
          font-weight: 400;
          font-size: 62px;
          line-height: 1.05;
          letter-spacing: 2px;
          text-transform: uppercase;
          white-space: nowrap;
        }
        .hook-word {
          display: inline-block;
          opacity: 0;
          filter: blur(0px);
          will-change: transform, opacity, filter;
        }
        .hook-word-accent {
          color: #e2823f;
        }
        #hook-subline .hook-word:not(.hook-word-accent) {
          color: #f4ead9;
        }

        #hook-tagline {
          top: 630px;
          left: 110px;
          right: 110px;
          font-family: "Inter", sans-serif;
          font-weight: 300;
          font-size: 26px;
          line-height: 1.5;
          letter-spacing: 0.2px;
          color: #f4ead9;
          opacity: 0;
          will-change: transform, opacity;
        }
      </style>

      <div id="root" data-composition-id="01-hook" data-width="1080" data-height="1080" data-duration="6">
        <div class="clip" id="hook-bg" data-start="0" data-duration="6" data-track-index="0"></div>

        <div class="clip" id="hook-glow" data-start="0" data-duration="6" data-track-index="1"></div>

        <div class="clip hook-stack" id="hook-eyebrow" data-start="0" data-duration="6" data-track-index="2">
          JOARES MENDES DE FREITAS
        </div>

        <div class="clip hook-stack" id="hook-a" data-start="0" data-duration="6" data-track-index="3">A</div>

        <div class="clip hook-stack" id="hook-hero" data-start="0" data-duration="6" data-track-index="4">
          JORNADA
        </div>

        <div class="clip hook-stack" id="hook-subline" data-start="0" data-duration="6" data-track-index="5">
          <span class="hook-word" id="hook-sub-w1">DE</span>
          <span class="hook-word" id="hook-sub-w2">UM</span>
          <span class="hook-word hook-word-accent" id="hook-sub-w3">SONHADOR</span>
        </div>

        <div class="clip hook-stack" id="hook-tagline" data-start="0" data-duration="6" data-track-index="6">
          Transformando sonhos em realização
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.2s) — ambient glow blooms, eyebrow settles ──────
        // ambient-glow-bloom: un-triggered radial halo, bloom-in then a
        // bounded idle breathe (never a CSS/GSAP loop) during the hold.
        const GLOW_START = 0.15;
        const GLOW_BLOOM_DUR = 1.0;
        const GLOW_PEAK_OPACITY = 0.38; // stays within the <=0.45 wash ceiling

        tl.fromTo(
          "#hook-glow",
          { opacity: 0, scale: 0.85 },
          { opacity: GLOW_PEAK_OPACITY, scale: 1, duration: GLOW_BLOOM_DUR, ease: "power2.out" },
          GLOW_START,
        );

        // Eyebrow — small fade-up settle, lands well inside Scene 1's window.
        tl.fromTo(
          "#hook-eyebrow",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          0.45,
        );

        // Bounded idle breathe on the glow — a single finite tween reading
        // sin(phase); sin(0) = 0 so it starts exactly at the bloom's resting
        // state. Runs under the whole rest of the hold (Scenes 2-5); this is
        // the only motion the shot keeps alive once the type has landed.
        const glowEl = document.getElementById("hook-glow");
        const BREATHE_START = GLOW_START + GLOW_BLOOM_DUR; // 1.15s
        const BREATHE_DUR = 6 - BREATHE_START; // fills to the end of the shot
        const BREATHE_CYCLES = 1.5; // ~3.2s per breath — slow ambient pulse
        const OPACITY_AMP = 0.03;
        const SCALE_AMP = 0.02;
        const glowPhase = { p: 0 };
        tl.to(
          glowPhase,
          {
            p: Math.PI * 2 * BREATHE_CYCLES,
            duration: BREATHE_DUR,
            ease: "none",
            onUpdate: () => {
              const s = Math.sin(glowPhase.p);
              glowEl.style.opacity = String(GLOW_PEAK_OPACITY + s * OPACITY_AMP);
              glowEl.style.transform = `scale(${1 + s * SCALE_AMP})`;
            },
          },
          BREATHE_START,
        );

        // ── Scene 2 (1.2–2.6s) — "A" spring-pops in, small, above the hero ─
        // spring-pop-entrance: fromTo scale 0->1 + opacity 0->1 on a smooth
        // power3.out long-tail settle — no overshoot.
        tl.fromTo(
          "#hook-a",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          1.2,
        );

        // ── Scene 3 (2.6–4.2s) — "JORNADA" slams in, dominant ──────────────
        // kinetic-beat-slam: a distinct entrance from the prior beat — scale
        // + blur collapse resolving to sharp on a hard power4.out attack.
        tl.fromTo(
          "#hook-hero",
          { scale: 1.42, opacity: 0, filter: "blur(18px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
          2.6,
        );

        // ── Scene 4 (4.2–5.2s) — "DE UM SONHADOR" reveals per word ─────────
        // kinetic-beat-slam's per-word variant + depth-of-field-blur's
        // sharp-on-arrival blur collapse: each word fromTo's opacity/y/blur
        // on a deterministic index-derived stagger (SONHADOR lands in coral
        // via the .hook-word-accent class, no extra tween needed).
        const subWords = ["#hook-sub-w1", "#hook-sub-w2", "#hook-sub-w3"];
        const SUB_START = 4.2;
        const SUB_STAGGER = 0.18;
        const SUB_WORD_DUR = 0.5;
        subWords.forEach((sel, i) => {
          tl.fromTo(
            sel,
            { opacity: 0, y: 14, filter: "blur(10px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: SUB_WORD_DUR, ease: "power3.out" },
            SUB_START + i * SUB_STAGGER,
          );
        });

        // ── Scene 5 (5.2–6.0s) — tagline rises and settles; frame holds ────
        tl.fromTo(
          "#hook-tagline",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          5.3,
        );

        window.__timelines["01-hook"] = tl;
      </script>
    </template>
  </body>
</html>
