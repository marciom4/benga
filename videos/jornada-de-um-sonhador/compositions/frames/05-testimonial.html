<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the runtime discards it on mount -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }
        #root * {
          box-sizing: border-box;
        }

        .testimonial-bg {
          position: absolute;
          inset: 0;
          background: #0b0806;
        }

        .testimonial-content {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .testimonial-title-row {
          margin-top: 108px;
          padding: 0 60px;
          width: 100%;
          display: flex;
          justify-content: center;
        }

        .testimonial-title {
          font-family: "Bebas Neue";
          font-weight: 400;
          font-size: 40px;
          line-height: 1.15;
          letter-spacing: 2.5px;
          color: #f4ead9;
          text-transform: uppercase;
          text-align: center;
          max-width: 820px;
        }

        .testimonial-card-zone {
          flex: 1;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 60px 130px;
        }

        .testimonial-card {
          position: relative;
          width: 720px;
          padding: 60px 56px;
          background: #f4ead9;
          border-top: 5px solid #e2823f;
        }

        .testimonial-card-glow {
          position: absolute;
          top: -18px;
          left: 40px;
          right: 40px;
          height: 40px;
          background: #e2823f;
          filter: blur(22px);
          opacity: 0.35;
          z-index: 0;
          pointer-events: none;
        }

        .testimonial-quote {
          position: relative;
          z-index: 1;
          font-family: "Inter";
          font-weight: 300;
          font-style: italic;
          font-size: 33px;
          line-height: 1.55;
          color: #0b0806;
          text-align: center;
          max-width: 600px;
          margin: 0 auto;
        }

        .testimonial-quote .word {
          display: inline-block;
        }

        .testimonial-attribution {
          position: relative;
          z-index: 1;
          margin-top: 26px;
          font-family: "Inter";
          font-weight: 600;
          font-size: 16px;
          letter-spacing: 3px;
          text-transform: uppercase;
          color: #e2823f;
          text-align: center;
        }
      </style>

      <div
        id="root"
        data-composition-id="05-testimonial"
        data-width="1080"
        data-height="1080"
        data-duration="7"
      >
        <div
          id="testimonial-bg"
          class="clip testimonial-bg"
          data-start="0"
          data-duration="7"
          data-track-index="0"
        ></div>

        <div
          id="testimonial-content"
          class="clip testimonial-content"
          data-start="0"
          data-duration="7"
          data-track-index="1"
        >
          <div class="testimonial-title-row">
            <div id="testimonial-title" class="testimonial-title">
              O que dizem sobre o livro
            </div>
          </div>

          <div class="testimonial-card-zone">
            <div id="testimonial-card" class="testimonial-card">
              <div id="testimonial-card-glow" class="testimonial-card-glow" aria-hidden="true"></div>
              <p id="testimonial-quote" class="testimonial-quote"></p>
              <p id="testimonial-attribution" class="testimonial-attribution">
                — Leitor(a) da primeira edição
              </p>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var titleEl = document.getElementById("testimonial-title");
          var cardEl = document.getElementById("testimonial-card");
          var quoteEl = document.getElementById("testimonial-quote");
          var attributionEl = document.getElementById("testimonial-attribution");
          var glowEl = document.getElementById("testimonial-card-glow");

          // Build the quote as per-word spans for the staggered reveal (Scene 2).
          var QUOTE_TEXT = "Este livro mudou a forma como vejo meus próprios sonhos.";
          var words = QUOTE_TEXT.split(" ");
          quoteEl.innerHTML = words
            .map(function (w) {
              return '<span class="word">' + w + "</span>";
            })
            .join(" ");
          var wordEls = quoteEl.querySelectorAll(".word");

          var tl = gsap.timeline({ paused: true });

          // Scene 1 (0.0-1.0s): section title slides up + fades in — the frame's one lead-in beat.
          tl.fromTo(
            titleEl,
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
            0.2,
          );

          // Scene 2 (1.0-3.5s): the single testimonial card slides up to center — the blueprint's
          // ONE restrained move — then the quote reveals word-by-word inside it.
          tl.fromTo(
            cardEl,
            { opacity: 0, y: 60 },
            { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
            1.0,
          );
          tl.fromTo(
            wordEls,
            { opacity: 0, y: 14 },
            {
              opacity: 1,
              y: 0,
              duration: 0.45,
              ease: "power3.out",
              stagger: 0.115,
            },
            1.85,
          );

          // Scene 3 (3.5-5.0s): attribution rises in below the quote.
          tl.fromTo(
            attributionEl,
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
            3.6,
          );

          // Scene 4 (5.0-7.0s): hold — the card is fully settled. The only motion left is a
          // bounded, low-amplitude jitter on the coral border glow (sine-wave-loop, single
          // ~2s breath). sin(0) = 0 at t=5.0 so it starts exactly at the glow's resting
          // opacity (0.35, set statically in CSS) — no jump.
          var GLOW_BASE = 0.35;
          var GLOW_AMP = 0.09;
          var phase = { p: 0 };
          tl.to(
            phase,
            {
              p: Math.PI * 2,
              duration: 2.0,
              ease: "none",
              onUpdate: function () {
                glowEl.style.opacity = GLOW_BASE + Math.sin(phase.p) * GLOW_AMP;
              },
            },
            5.0,
          );

          window.__timelines["05-testimonial"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
