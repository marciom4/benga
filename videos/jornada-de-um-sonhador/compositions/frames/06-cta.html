<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the runtime discards everything
         outside <template> — all real styles/markup/script live inside it. -->
    <title>06 — CTA: sua jornada começa aqui</title>
  </head>
  <body>
    <template>
      <style>
        /* Root styled by #root (never a class on the data-composition-id element) —
           see hyperframes-core sub-compositions.md Pitfall 3. */
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          container-name: cta06;
          font-family: "Inter", sans-serif;
        }

        /* Base clip layer positioning */
        .clip {
          position: absolute;
          inset: 0;
        }

        /* --- Ground: cream field (full-bleed background lives on a class="clip"
             child, never on #root — a root background can render invisible at
             assembly per the core contract). --- */
        #cta06-bg {
          background-color: #f4ead9;
        }

        /* --- Stage: everything else rides on top of the cream ground. --- */
        #cta06-stage {
          /* transparent — content only */
        }

        /* Eyebrow — ink on cream (Closing Plate chrome), tracked Inter label */
        .cta06-eyebrow {
          position: absolute;
          top: 14cqh;
          left: 50%;
          font-family: "Inter", sans-serif;
          font-weight: 700;
          font-size: 1.9cqw;
          letter-spacing: 0.35em;
          text-transform: uppercase;
          color: #0b0806;
          text-align: center;
          white-space: nowrap;
          will-change: transform, opacity;
        }

        /* Headline — Bebas hero-title, ink, the dominant element of the cream field */
        .cta06-headline {
          position: absolute;
          top: 34cqh;
          left: 50%;
          font-family: "Bebas Neue", sans-serif;
          font-weight: 400;
          font-size: 9cqw;
          line-height: 0.95;
          letter-spacing: 0.02em;
          text-transform: uppercase;
          color: #0b0806;
          text-align: center;
          white-space: nowrap;
          will-change: transform, opacity, filter;
        }

        /* Accent-line — coral, self-draws below the headline (closing variant: thin bar) */
        .cta06-accent-svg {
          position: absolute;
          top: 48cqh;
          left: 50%;
          transform: translateX(-50%);
          width: 10cqw;
          height: 0.7cqw;
          overflow: visible;
        }
        .cta06-accent-svg path {
          fill: none;
          stroke: #e2823f;
          stroke-width: 14;
          stroke-linecap: square; /* 0-radius brand law — no rounded pen tip */
        }

        /* --- Closing coral info-bar (bottom band) — the video's final CTA;
             the one intentional full-bleed bottom element in this silent,
             caption-less project. --- */
        .cta06-band-bg {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 36cqh;
          background-color: #e2823f;
          transform-origin: 50% 100%; /* wipe grows upward from the bottom edge */
          overflow: hidden;
          will-change: transform;
        }
        .cta06-band-bg::before {
          content: "";
          position: absolute;
          inset: 0;
          background-image: repeating-linear-gradient(
            45deg,
            transparent 0 20px,
            rgba(0, 0, 0, 0.06) 20px 40px
          );
        }

        .cta06-band-content {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 36cqh;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 5cqw;
          box-sizing: border-box;
        }

        .cta06-price {
          font-family: "Bebas Neue", sans-serif;
          font-weight: 400;
          font-size: 4.6cqw;
          letter-spacing: 0.02em;
          text-transform: uppercase;
          color: #0b0806;
          white-space: nowrap;
          will-change: transform, opacity;
        }

        .cta06-cta-group {
          display: flex;
          align-items: center;
          gap: 1.6cqw;
          will-change: transform, opacity;
        }

        /* Generic chat-bubble icon — CSS-only, ink, NOT the real WhatsApp glyph */
        .cta06-chat-icon {
          position: relative;
          width: 4.6cqw;
          height: 4.2cqw;
          flex-shrink: 0;
          background-color: #0b0806;
          border-radius: 22% 22% 22% 4%;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.5cqw;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        .cta06-dot {
          display: block;
          width: 0.6cqw;
          height: 0.6cqw;
          border-radius: 50%;
          background-color: #f4ead9;
        }

        .cta06-cta-text {
          font-family: "Inter", sans-serif;
          font-weight: 800;
          font-size: 1.7cqw;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #0b0806;
          white-space: nowrap;
        }
      </style>

      <div
        id="root"
        data-composition-id="06-cta"
        data-start="0"
        data-duration="10"
        data-width="1080"
        data-height="1080"
      >
        <!-- Ground: cream field, full duration -->
        <div id="cta06-bg" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>

        <!-- Stage: all content, one continuous shot, full duration -->
        <div id="cta06-stage" class="clip" data-start="0" data-duration="10" data-track-index="1">
          <div class="cta06-eyebrow" id="cta06-eyebrow">SUA JORNADA</div>
          <div class="cta06-headline" id="cta06-headline">COMEÇA AQUI</div>

          <svg class="cta06-accent-svg" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true">
            <path id="cta06-accent-path" d="M10 10 L290 10" />
          </svg>

          <div class="cta06-band-bg" id="cta06-band-bg"></div>

          <div class="cta06-band-content">
            <div class="cta06-price" id="cta06-price">R$ 35,00</div>
            <div class="cta06-cta-group" id="cta06-cta-group">
              <div class="cta06-chat-icon" id="cta06-chat-icon">
                <span class="cta06-dot"></span>
                <span class="cta06-dot"></span>
                <span class="cta06-dot"></span>
              </div>
              <div class="cta06-cta-text">PEÇA PELO WHATSAPP</div>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–1.4s) — eyebrow "SUA JORNADA" settles small, top-center.
        // xPercent:-50 folds the horizontal centering into the GSAP-controlled
        // transform (fromTo states it explicitly in both from/to — no CSS
        // transform on this element, so no gsap_css_transform_conflict).
        tl.fromTo(
          "#cta06-eyebrow",
          { xPercent: -50, y: -16, opacity: 0 },
          { xPercent: -50, y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
          0.3,
        );

        // Scene 2 (1.4–3.0s) — "COMEÇA AQUI" kinetic beat-slam: hard slam,
        // fast settle (power4.out), scale+blur collapse per kinetic-beat-slam.md.
        tl.fromTo(
          "#cta06-headline",
          { xPercent: -50, scale: 1.5, filter: "blur(16px)", opacity: 0 },
          {
            xPercent: -50,
            scale: 1,
            filter: "blur(0px)",
            opacity: 1,
            duration: 0.5,
            ease: "power4.out",
          },
          1.5,
        );

        // Scene 3 (3.0–4.6s) — coral accent-line self-draws below the headline
        // (svg-path-draw.md): measure the real path length, animate dashoffset.
        const accentPath = document.getElementById("cta06-accent-path");
        const accentLen = accentPath.getTotalLength();
        accentPath.style.strokeDasharray = String(accentLen);
        accentPath.style.strokeDashoffset = String(accentLen);
        tl.to(accentPath, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 3.1);

        // Scene 4 (4.6–6.4s) — coral info-bar reveals bottom-up (scaleY wipe,
        // transform-origin: bottom), while price + CTA phrase cluster near the
        // band's center and expand outward to their left/right resting slots
        // (center-outward-expansion.md).
        tl.fromTo(
          "#cta06-band-bg",
          { scaleY: 0 },
          { scaleY: 1, duration: 0.7, ease: "power3.out" },
          4.6,
        );
        tl.fromTo(
          "#cta06-price",
          { x: 160, opacity: 0, scale: 0.7 },
          { x: 0, opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" },
          5.0,
        );
        tl.fromTo(
          "#cta06-cta-group",
          { x: -160, opacity: 0, scale: 0.7 },
          { x: 0, opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" },
          5.15,
        );

        // Scene 5 (6.4–8.4s) — generic chat-bubble icon spring-pops in beside
        // the CTA phrase (spring-pop-entrance.md: fromTo, power3.out, no
        // overshoot on arrival), then takes a subtle press-release settle
        // (press-release-spring.md's "subtle press" variation) to sell weight.
        tl.fromTo(
          "#cta06-chat-icon",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          6.4,
        );
        tl.to("#cta06-chat-icon", { scale: 0.94, duration: 0.12, ease: "power1.in" }, 6.9);
        tl.to("#cta06-chat-icon", { scale: 1, duration: 0.35, ease: "back.out(1.4)" }, 7.02);

        // Scene 6 (8.4–10.0s) — final hold. This is the last frame of the video:
        // a quiet settle, not an exit tween. Only the accent-line's glow keeps a
        // bounded, low-amplitude jitter (sine-wave-loop.md) — one finite cycle.
        const glowPhase = { p: 0 };
        tl.to(
          glowPhase,
          {
            p: Math.PI * 2 * 1,
            duration: 1.6,
            ease: "none",
            onUpdate: () => {
              const amp = 0.12;
              const blur = 4 + Math.sin(glowPhase.p) * 2;
              const alpha = 0.35 + Math.sin(glowPhase.p) * amp;
              accentPath.style.filter = `drop-shadow(0 0 ${blur}px rgba(226,130,63,${alpha}))`;
            },
          },
          8.4,
        );

        window.__timelines["06-cta"] = tl;
      </script>
    </template>
  </body>
</html>
